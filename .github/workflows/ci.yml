name: CI pipeline

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - Main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.0
          
      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Run tests
        run: pytest test/test.py
